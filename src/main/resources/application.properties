# Configuración del servidor
server.port=8080
spring.application.name=techlab-ecommerce-api

# Configuración de MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/techlab_ecommerce?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Configuración de CORS para permitir conexiones desde el frontend
spring.web.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

